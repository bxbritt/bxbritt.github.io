    <script>
        document.querySelectorAll('.catalog-block').forEach((block) => {
            const catalog = block.querySelector('.catalog');
            const prev = block.querySelector('.catalog-prev');
            const next = block.querySelector('.catalog-next');

            function step() {
                const item = catalog.querySelector('.catalog-item');
                return item ? item.offsetWidth + 20 : catalog.clientWidth;
            }

            function updateButtons() {
                prev.disabled = catalog.scrollLeft <= 0;
                next.disabled = catalog.scrollLeft + catalog.clientWidth >= catalog.scrollWidth - 1;
            }

            prev.addEventListener('click', () => catalog.scrollBy({ left: -step() }));
            next.addEventListener('click', () => catalog.scrollBy({ left: step() }));
            catalog.addEventListener('scroll', updateButtons);
            window.addEventListener('resize', updateButtons);
            window.addEventListener('load', updateButtons);
            updateButtons();
        });
    </script>
    <script>
        document.documentElement.classList.add('js');
        const revealItems = document.querySelectorAll('.reveal');
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            revealItems.forEach((item) => observer.observe(item));
        } else {
            revealItems.forEach((item) => item.classList.add('visible'));
        }
    </script>
